<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ScienceQuest</title>
<style>
:root{--bg:#f7f8fb;--card:#fff;--tx:#1f2937;--mu:#6b7280;--bd:#e5e7eb;--ok:#16a34a;--okb:#dcfce7;--no:#dc2626;--nob:#fee2e2;--bio:#16a34a;--che:#7c3aed;--mat:#2563eb;--phy:#ea580c;--ac:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
[data-theme=dark]{--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--mu:#9ca3af;--bd:#374151;--okb:#14532d;--nob:#7f1d1d;--bio:#4ade80;--che:#a78bfa;--mat:#60a5fa;--phy:#fb923c;--ac:#60a5fa}
[data-theme=pastel]{--bg:#fdf2f8;--card:#fffafc;--tx:#4a3b52;--mu:#8b7a93;--bd:#f3d6e6;--bio:#3f9e6b;--che:#8b6fd0;--mat:#4a82c4;--phy:#d9803a;--ac:#c26fa3}
[data-theme=arcade]{--bg:#1a0b3b;--card:#2b1260;--tx:#fff;--mu:#c9b6ff;--bd:#5b2bb8;--okb:#065f46;--nob:#9f1239;--bio:#3dff8f;--che:#c084fc;--mat:#38bdf8;--phy:#ffb020;--ac:#ff4fd8}
*{box-sizing:border-box}html{height:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);min-height:100%;transition:background .3s}
main{max-width:960px;margin:0 auto;padding:16px 16px 24px}
h1,h2,h3{margin:.3em 0}
.card{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:16px;margin:12px 0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--ac);color:#fff;border:0;border-bottom:4px solid rgba(0,0,0,.25);border-radius:14px;padding:10px 18px;font-weight:700;cursor:pointer;transition:transform .1s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(3px);border-bottom-width:1px}
.btn.g{background:var(--card);color:var(--tx);border:2px solid var(--bd)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:10px;width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.bar{height:12px;background:var(--bd);border-radius:9px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--c,var(--ac));border-radius:9px;transition:width .6s}
.sub{cursor:pointer;border-color:var(--c);text-align:center}.sub:hover{transform:translateY(-3px)}.sub{transition:transform .2s}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border:2px solid var(--bd);border-bottom-width:4px;border-radius:14px;background:var(--card);cursor:pointer;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.no{background:var(--nob);border-color:var(--no);animation:shake .4s}
.opt:disabled{cursor:default;color:var(--tx)}
.mu{color:var(--mu);font-size:.9em}.pill{display:inline-block;padding:2px 10px;border-radius:99px;border:2px solid var(--bd);font-size:.8em;font-weight:700}
.tabs button{margin-right:6px}.me{background:var(--okb);border-radius:10px}
.mas{display:flex;gap:10px;align-items:center}.bub{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:8px 12px;flex:1}
.mas svg.happy,.mas svg.win{animation:hop .6s 2}.mas svg.sad{animation:shake .5s}.mas svg.idle{animation:float 3s infinite}
.badge{font-size:2em}.off{filter:grayscale(1);opacity:.35}
.foot{text-align:right;padding:8px 16px 16px;font-weight:700;font-size:.9em;color:var(--mu)}
.demo{background:#fef9c3;color:#713f12;border-radius:10px;padding:6px 10px;font-size:.85em;font-weight:600}
.pop{animation:pop .5s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes hop{50%{transform:translateY(-14px)}}@keyframes float{50%{transform:translateY(-4px)}}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<main id="app"></main>
<div class="foot">Made with ❤️ By Shaurya</div>
<script>
// ---------- DATA (original questions; [text, options, correctIndex, explanation]) ----------
const D=[
{id:'bio',name:'Biology',c:'--bio',m:'Dr. Bio',e:'🩺',ch:[
 {id:'bio1',no:1,name:'The Living World',desc:'Classification, nomenclature and taxonomy.',lv:'Easy',q:[
  ['What is the basic unit of classification?',['Genus','Species','Family','Order'],1,'Species is the lowest and basic taxonomic category.'],
  ['Who introduced binomial nomenclature?',['Carolus Linnaeus','Charles Darwin','Aristotle','Gregor Mendel'],0,'Linnaeus gave the two-part (genus + species) naming system.'],
  ['Which category is immediately higher than Class?',['Order','Phylum','Family','Genus'],1,'Order: Kingdom > Phylum > Class > Order > Family > Genus > Species.'],
  ['In a scientific name, the genus name starts with…',['A small letter','A capital letter','Any letter','A number'],1,'Genus begins with a capital letter, species with a small letter.'],
  ['A "taxon" is…',['Only a species','A taxonomic group of any rank','A type of cell','A kingdom only'],1,'Any rank-level group, e.g. a genus or a class, is a taxon.']]},
 {id:'bio_c2',no:2,name:"Biological Classification",desc:"Five kingdoms, bacteria, fungi and lichens.",lv:'Medium',q:[
  ["Which of the following characters was NOT used by R.H. Whittaker for his five-kingdom classification system?", ["Thallus organization", "Anatomical complexity of reproductive organs", "Mode of nutrition", "Phylogenetic relationship"], 1, "Whittaker used cell structure, thallus organisation, mode of nutrition, reproduction and phylogenetic relationships. 'Anatomical complexity of reproductive organs' is not one of these criteria.", "BIO-C2-001", "Whittaker's five kingdoms", "Medium"],
  ["Why are archaebacteria able to survive in extreme habitats such as salty areas (halophiles) and hot springs (thermoacidophiles)?", ["Presence of a rigid cellulosic cell wall", "Presence of numerous flagella for mobility away from stress", "A different cell wall and plasma membrane lipid structure", "Ability to perform specialized oxygenic photosynthesis"], 2, "Archaebacteria differ from other bacteria in cell wall and membrane lipid composition (no peptidoglycan), which helps them survive harsh conditions such as high salt and heat.", "BIO-C2-002", "Archaebacteria", "Medium"],
  ["Which of the following statements is correct regarding Mycoplasma?", ["They completely lack a cell wall and can survive without oxygen", "They are photosynthetic autotrophs with a rigid peptidoglycan wall", "They are larger than typical bacteria and cause diseases only in animals", "They contain double-stranded RNA as their primary genetic material"], 0, "Mycoplasma are the smallest living cells; they lack a cell wall and can survive without oxygen.", "BIO-C2-003", "Mycoplasma", "Medium"],
  ["Commonly known as sac fungi, which of the following genera belongs to Ascomycetes?", ["Agaricus", "Rhizopus", "Penicillium", "Alternaria"], 2, "Penicillium is an Ascomycete (sac fungus). Agaricus is a Basidiomycete, Rhizopus a Phycomycete and Alternaria a Deuteromycete.", "BIO-C2-004", "Fungi classes", "Medium"],
  ["Lichens are very good pollution indicators. They do not grow in areas that are heavily polluted, particularly by which of the following gases?", ["Carbon monoxide", "Methane", "Ozone", "Sulphur dioxide"], 3, "Lichens are sensitive to sulphur dioxide, so they do not grow in polluted air and serve as pollution indicators.", "BIO-C2-005", "Lichens", "Medium"]]},
 {id:'bio_c3',no:3,name:"Plant Kingdom",desc:"Algae, bryophytes, pteridophytes, gymnosperms, angiosperms.",lv:'Medium',q:[
  ["Which of the following pigments are characteristically present in members of Chlorophyceae?", ["Chlorophyll a and b", "Chlorophyll a and c", "Chlorophyll a and d", "Fucoxanthin and chlorophyll a"], 0, "Chlorophyceae (green algae) have chlorophyll a and b. Brown algae have a and c with fucoxanthin; red algae have a and d.", "BIO-C3-001", "Algae pigments", "Medium"],
  ["A marine alga that displays distinct pyriform (pear-shaped) gametes with two laterally attached flagella belongs to which class?", ["Chlorophyceae", "Phaeophyceae", "Rhodophyceae", "Cyanophyceae"], 1, "Brown algae (Phaeophyceae) have pear-shaped gametes with two laterally attached flagella.", "BIO-C3-002", "Brown algae", "Medium"],
  ["In red algae (Rhodophyceae), the food is stored as floridean starch, which is very similar in structure to:", ["Cellulose and pectin", "Mannitol and algin", "Amylopectin and glycogen", "Laminarin and starch"], 2, "Red algae store floridean starch, which is similar in structure to amylopectin and glycogen.", "BIO-C3-003", "Red algae", "Medium"],
  ["Gemmae are green, multicellular, asexual buds that develop in small receptacles called gemma cups in which of the following plants?", ["Funaria", "Sphagnum", "Dryopteris", "Marchantia"], 3, "Marchantia reproduces asexually by gemmae formed in gemma cups on its thallus.", "BIO-C3-004", "Bryophytes", "Medium"],
  ["An organism with a haplontic life cycle has a dominant photosynthetic phase that is a free-living gametophyte. Which of the following algae exhibits this type of life cycle?", ["Volvox", "Fucus", "Ectocarpus", "Polysiphonia"], 0, "Volvox has a haplontic life cycle: the free-living gametophyte dominates and the zygote is the only diploid stage. Fucus is diplontic; Ectocarpus and Polysiphonia are haplo-diplontic.", "BIO-C3-005", "Life cycles", "Medium"],
  ["Heterospory—the production of two kinds of spores, macro (mega) and microspores—is a notable evolutionary feature observed in pteridophytes like:", ["Psilotum and Equisetum", "Selaginella and Salvinia", "Pteris and Adiantum", "Lycopodium and Dryopteris"], 1, "Selaginella and Salvinia are heterosporous (they produce mega- and microspores); the other genera listed are homosporous.", "BIO-C3-006", "Pteridophytes", "Medium"],
  ["In gymnosperms, the endosperm is formed before fertilization and is therefore:", ["Triploid", "Diploid", "Haploid", "Tetraploid"], 2, "In gymnosperms the endosperm forms from the megaspore before fertilisation, so it is haploid (n).", "BIO-C3-007", "Gymnosperms", "Medium"],
  ["The phenomenon of double fertilization, unique to angiosperms, involves syngamy and triple fusion. Triple fusion results directly in the formation of:", ["Zygote", "Embryo", "Seed coat", "Primary endosperm nucleus"], 3, "Triple fusion (one male gamete with two polar nuclei) forms the triploid primary endosperm nucleus; syngamy forms the zygote.", "BIO-C3-008", "Double fertilisation", "Medium"],
  ["Which shared requirement do both bryophytes and pteridophytes have for sexual reproduction to successfully occur?", ["External water is essential for the swimming of male gametes", "Presence of dominant independent sporophytes", "Production of naked seeds", "Absence of multicellular sex organs"], 0, "In bryophytes and pteridophytes the male gametes swim, so external water is needed for fertilisation.", "BIO-C3-009", "Sexual reproduction", "Medium"],
  ["Which group of plants exhibits a sporophyte that is physically attached to and nutritionally dependent on the photosynthetic gametophyte?", ["Angiosperms", "Gymnosperms", "Pteridophytes", "Bryophytes"], 3, "In bryophytes the sporophyte stays attached to the gametophyte and depends on it for nutrition.", "BIO-C3-010", "Alternation of generations", "Medium"]]},
 {id:'bio_c4',no:4,name:"Animal Kingdom",desc:"Classification and features of animal phyla.",lv:'Medium',q:[
  ["Which of the following animal groups exhibits organ-system level of organization for the first time in the evolutionary series?", ["Porifera", "Platyhelminthes", "Aschelminthes", "Cnidaria"], 2, "Aschelminthes (roundworms) exhibit organ-system level of organization, where organs are associated to form functional systems.", "BIO-C4-001", "Levels of organisation", "Medium"],
  ["Which of the following phyla exhibits radial symmetry in the adult stage while possessing bilateral symmetry in the larval stage?", ["Cnidaria", "Ctenophora", "Echinodermata", "Mollusca"], 2, "Adult echinoderms are radially symmetrical, but their free-swimming larvae are bilaterally symmetrical.", "BIO-C4-002", "Symmetry", "Medium"],
  ["An undifferentiated jelly-like layer present between the ectoderm and endoderm in diploblastic animals is known as:", ["Mesoglea", "Mesoderm", "Pseudocoelom", "Hemocoel"], 0, "Mesoglea is an undifferentiated layer situated between the ectoderm and endoderm in animals like Cnidarians.", "BIO-C4-003", "Germ layers", "Medium"],
  ["Animals in which the body cavity is not lined by mesoderm, but instead mesoderm is present as scattered pouches between ectoderm and endoderm, are called:", ["Coelomates", "Acoelomates", "Schizocoelomates", "Pseudocoelomates"], 3, "In pseudocoelomates, the cavity is not lined by mesoderm; instead, mesoderm appears as scattered pouches (as in Aschelminthes).", "BIO-C4-004", "Coelom", "Medium"],
  ["Metameric segmentation (true external and internal segmentation) is a hallmark characteristic of which group of phyla?", ["Platyhelminthes, Aschelminthes, Annelida", "Annelida, Arthropoda, Chordata", "Mollusca, Echinodermata, Chordata", "Porifera, Cnidaria, Ctenophora"], 1, "Annelida (earthworms), Arthropoda (insects), and Chordata (vertebrates) exhibit true metameric segmentation.", "BIO-C4-005", "Segmentation", "Medium"],
  ["The unique water transport or canal system in sponges (Porifera) is lined and driven by the beating of:", ["Osculum", "Spicules", "Choanocytes or collar cells", "Spongin fibers"], 2, "Choanocytes (collar cells) line the spongocoel and canals; their flagellar movements create the water current.", "BIO-C4-006", "Porifera", "Medium"],
  ["The phenomenon of metagenesis (alternation of generation between asexual polyps and sexual medusae) is typically observed in:", ["Obelia", "Hydra", "Physalia", "Adamsia"], 0, "Obelia exhibits metagenesis where polyps produce medusae asexually, and medusae produce polyps sexually.", "BIO-C4-007", "Cnidaria", "Medium"],
  ["Comb jellies (Phylum Ctenophora) are distinguished by the presence of how many external rows of ciliated comb plates?", ["4 rows", "6 rows", "10 rows", "8 rows"], 3, "Ctenophores bear 8 external rows of ciliated comb plates which help in locomotion.", "BIO-C4-008", "Ctenophora", "Medium"],
  ["Specialized excretory cells called flame cells are characteristic of which of the following phyla?", ["Aschelminthes", "Platyhelminthes", "Annelida", "Arthropoda"], 1, "Flame cells help in osmoregulation and excretion in flatworms (Platyhelminthes).", "BIO-C4-009", "Platyhelminthes", "Medium"],
  ["Aschelminthes are commonly known as roundworms because their cross-section appearance is:", ["Flat", "Oval", "Circular", "Irregular"], 2, "When viewed in a transverse cross-section, the body appears circular, giving them the name roundworms.", "BIO-C4-010", "Aschelminthes", "Medium"],
  ["Aquatic annelids, such as Nereis, possess lateral appendages called ____ which help in swimming.", ["Parapodia", "Setae", "Spicules", "Radula"], 0, "Nereis uses parapodia for swimming and locomotion.", "BIO-C4-011", "Annelida", "Medium"],
  ["Respiratory organs in scorpions and spiders (Arthropods) consist of:", ["Gills", "Tracheal tubes", "Book gills", "Book lungs"], 3, "Arachnids like spiders and scorpions breathe via book lungs, which are stacked vascular lamellae.", "BIO-C4-012", "Arthropoda", "Medium"],
  ["In molluscs, the mouth contains a file-like rasping organ used for feeding called the:", ["Mantle", "Radula", "Ctenidium", "Visceral hump"], 1, "The radula is a ribbon-like structure with rows of teeth used to scrape food.", "BIO-C4-013", "Mollusca", "Medium"],
  ["The distinctive system in Echinoderms that assists in locomotion, capture/transport of food, and respiration is the:", ["Canal system", "Vascular system with hemoglobin", "Water vascular system", "Tracheal system"], 2, "The water vascular system is the most unique and characteristic feature of echinoderms.", "BIO-C4-014", "Echinodermata", "Medium"],
  ["Which of the following is a fundamental diagnostic feature shared by all chordates at some point during their lifecycle?", ["Presence of a notochord", "Presence of a ventral solid nerve cord", "Presence of a three-chambered heart", "Presence of an exoskeleton of chitin"], 0, "A dorsal, rod-like notochord is a primary structural characteristic defining all chordates.", "BIO-C4-015", "Chordata", "Medium"]]},
 {id:'bio_c5',no:5,name:"Morphology of Flowering Plants",desc:"Roots, stems, leaves, flowers, fruits and seeds.",lv:'Medium',q:[
  ["In mangrove plants growing in swampy areas, many roots come out of the ground and grow vertically upwards. What is the primary function of these specialized roots, known as pneumatophores?", ["Storage of food and water reserves during drought conditions", "Getting oxygen for respiration in anaerobic soil conditions", "Providing mechanical support and anchoring the plant against strong tidal waves", "Absorbing minerals from deep-seated underground rock strata"], 1, "Pneumatophores possess tiny pores called lenticels through which they help the plant absorb oxygen from the atmosphere since the waterlogged soil lacks sufficient oxygen.", "BIO-C5-001", "Root modifications", "Medium"],
  ["Banyan trees feature hanging prop roots that eventually anchor into the soil. What is the primary role of these prop roots?", ["Conducting photosynthesis in place of damaged leaves", "Absorbing atmospheric humidity and rain directly", "Providing heavy mechanical support to the massive spreading branches", "Vegetative propagation to form new independent trees"], 2, "Prop roots act like pillars to support the heavy, spreading horizontal branches of the banyan tree.", "BIO-C5-002", "Root modifications", "Medium"],
  ["Thorns found in Citrus and Bougainvillea are modifications of which plant organ, and what purpose do they serve?", ["Axillary bud modified into a woody, straight, and pointed structure for protection against browsing animals", "Leaf modification meant exclusively for climbing on vertical supports", "Floral bud modified to store water in arid environmental conditions", "Root modification designed to absorb surface dew and rainfall"], 0, "Axillary buds of stems get modified into woody, pointed thorns which protect the plants from herbivores.", "BIO-C5-003", "Stem modifications", "Medium"],
  ["A slender, spirally coiled structure that helps plants climb, such as in gourds (cucumber, pumpkins) and grapevines, is a modification of the:", ["Root system", "Floral parts", "Primary root hair layer", "Axillary bud of the stem"], 3, "In stem climbers like gourds and grapevines, axillary buds develop into delicate, spiraling tendrils to help the plant climb.", "BIO-C5-004", "Stem modifications", "Medium"],
  ["Parallel venation—where veins run parallel to each other within a lamina—is a characteristic feature of which major group of plants?", ["Dicots", "Monocots", "Pteridophytes exclusively", "Gymnosperms only"], 1, "Monocots (such as grasses, wheat, and banana) generally show parallel venation on their leaves.", "BIO-C5-005", "Leaf venation", "Medium"],
  ["In a racemose type of inflorescence:", ["The main axis terminates in a flower, restricting further upward growth.", "Flowers are borne in a basipetal order.", "The main axis continues to grow, and flowers are borne in an acropetal succession.", "Flowers are solitary and never arranged on a common floral axis."], 2, "In racemose inflorescence, the main axis keeps growing indefinitely, and flowers are arranged in acropetal order (older flowers at the base, younger ones at the apex).", "BIO-C5-006", "Inflorescence", "Medium"],
  ["When a flower can be divided into two equal radial halves in any vertical plane passing through the center (actinomorphic), which of the following represents an example of such a flower?", ["Bean", "Gulmohar", "Cassia", "Mustard"], 3, "Mustard, datura, and chili are classic examples of actinomorphic (radially symmetrical) flowers.", "BIO-C5-007", "Flower symmetry", "Medium"],
  ["In vexillary aestivation (papilionaceous), the largest standard petal overlaps two lateral wings, which in turn overlap the smallest anterior petals (keel). In which family is this specific arrangement characteristically found?", ["Fabaceae", "Solanaceae", "Liliaceae", "Brassicaceae"], 0, "Fabaceae (pea family) exhibits characteristic vexillary (or papilionaceous) aestivation with a standard, wings, and keel.", "BIO-C5-008", "Aestivation", "Medium"],
  ["When the placenta is borne at the base of the ovary and a single ovule is attached to it, the type of placentation is known as:", ["Axile", "Marginal", "Basal", "Parietal"], 2, "In basal placentation, the placenta develops at the base of the ovary and bears a single ovule, as seen in sunflower and marigold.", "BIO-C5-009", "Placentation", "Medium"],
  ["Seeds that do not retain any residual endosperm in the mature seed because it is completely consumed during embryo development are called:", ["Albuminous seeds", "Monocotyledonous seeds", "Perispermic seeds", "Non-endospermic (ex-albuminous) seeds"], 3, "Non-endospermic or ex-albuminous seeds (such as bean, gram, and pea) lack an endosperm in the mature seed as food is stored in the cotyledons.", "BIO-C5-011", "Seed structure", "Medium"],
  ["In maize grains (a monocot seed), the outer covering of the endosperm that separates the embryo by a distinct proteinaceous layer is known as:", ["Aleurone layer", "Coleoptile", "Coleorhiza", "Scutellum"], 0, "The aleurone layer is a protein-rich outer boundary layer of the endosperm in cereal grains like maize.", "BIO-C5-012", "Seed structure", "Medium"],
  ["A characteristic floral formula for the family Solanaceae featuring actinomorphic, bisexual flowers with fused sepals and fused petals and epipetalous stamens is represented by:", ["% K(5) C1+2+(2) A(9)+1 G(1)", "⊕ ⚥ K(5) C(5) A5 G(2)", "⊕ ⚥ P(3+3) A3+3 G(3)", "⊕ ⚥ K2+2 C4 A2+4 G(2)"], 1, "Solanaceae (potato family) formula shows actinomorphic (⊕), bisexual (⚥), pentamerous with fused sepals K(5) and petals C(5), 5 stamens, and a bicarpellary syncarpous superior ovary G(2).", "BIO-C5-013", "Floral formula", "Medium"],
  ["In fruits like apple and strawberry, the thalamus contributes significantly to fruit formation along with the ovary. Such fruits are designated as:", ["True fruits", "Parthenocarpic fruits", "False fruits (pseudocarp)", "Aggregated poly-achenes"], 2, "False fruits are those in which the thalamus contributes to fruit formation along with or instead of the ovary wall.", "BIO-C5-014", "Fruits", "Medium"],
  ["In Australian Acacia, the leaves are short-lived and soon fall off, while the petiole expands, becomes green, and synthesizes food. This flattened, green petiole modification is called a:", ["Phylloclade", "Cladode", "Pitcher", "Phyllode"], 3, "In Australian Acacia, the petiole expands and turns green to take over the function of photosynthesis, forming a phyllode.", "BIO-C5-015", "Leaf modifications", "Medium"]]},
 {id:'bio_c6',no:6,name:"Anatomy of Flowering Plants",desc:"Tissues, root and stem anatomy, secondary growth.",lv:'Medium',q:[
  ["The length of different internodes in a culm of sugarcane is variable due to the activity of which of the following meristems?", ["Shoot apical meristem", "Lateral meristem", "Intercalary meristem", "Cork cambium"], 2, "Intercalary meristem occurs between mature tissues and is specifically active in the elongation of regions like internodes in grasses and sugarcane.", "BIO-C6-001", "Meristems", "Medium"],
  ["Casparian strips, which are water-impermeable thickenings of suberin, are prominently developed in which specific layer of the root?", ["Endodermis", "Exodermis", "Pericycle", "Hypodermis"], 0, "The tangential and radial walls of the endodermal cells bear a deposition of water-impermeable suberin matrix known as the Casparian strip.", "BIO-C6-002", "Root anatomy", "Medium"],
  ["During the secondary growth of a dicot root, the complete vascular cambium ring is initially formed by the meristematic activity of:", ["Endodermal cells only", "Intrafascicular cambium only", "Cortex cells below epidermis", "Conjunctive tissue and pericycle cells"], 3, "The vascular cambium in roots originates from a portion of pericycle cells located outside the protoxylem and the conjunctive tissue cells lying just beneath the phloem bundles.", "BIO-C6-003", "Secondary growth", "Medium"],
  ["A transverse section of a typical monocot root can be easily identified by observing which of the following anatomical features?", ["Tetrarch xylem and small pith", "Polyarch xylem and well-developed large pith", "Conjoint collateral closed vascular bundles", "Presence of a continuous cambium ring"], 1, "Monocot roots generally exhibit a polyarch condition (more than six xylem bundles) and contain a large, well-developed parenchymatous pith.", "BIO-C6-004", "Root anatomy", "Medium"],
  ["In a dicotyledonous stem, the vascular bundles are described as conjoint, collateral, and \"open\". What does the term \"open\" signify here?", ["Presence of cambium between xylem and phloem", "Absence of a bundle sheath around the bundle", "Xylem and phloem situated on separate radii", "Vessels are completely open to the exterior surface"], 0, "An \"open\" vascular bundle possesses an active layer of cambium (intrafascicular cambium) sandwiched between xylem and phloem, enabling secondary growth.", "BIO-C6-005", "Stem anatomy", "Medium"]]},
 {id:'bio_c7',no:7,name:"Structural Organisation in Animals",desc:"Animal tissues and earthworm anatomy.",lv:'Medium',q:[
  ["Which type of epithelial tissue is composed of a single layer of flattened cells with irregular boundaries and is found in the walls of blood vessels and air sacs of the lungs?", ["Cuboidal epithelium", "Columnar epithelium", "Squamous epithelium", "Ciliated epithelium"], 2, "Simple squamous epithelium is made of a single thin layer of flattened cells with irregular boundaries, forming a diffusion boundary in sites like lung alveoli and blood vessel walls.", "BIO-C7-001", "Epithelial tissue", "Medium"],
  ["Which specific cell junction in epithelial tissues performs the critical function of stopping substances from leaking across a tissue?", ["Tight junctions", "Adhering junctions", "Gap junctions", "Synaptic junctions"], 0, "Tight junctions help to stop substances from leaking across a tissue barrier.", "BIO-C7-002", "Cell junctions", "Medium"],
  ["Intercalated discs, which allow communication channels for coordinated contraction, are a characteristic diagnostic feature of which type of muscle tissue?", ["Skeletal muscle tissue", "Smooth muscle tissue", "Voluntary striated muscle tissue", "Cardiac muscle tissue"], 3, "Cardiac muscle tissue is a contractile tissue present only in the heart. Cell junctions fusion plasma membranes make up intercalated discs that allow cardiac cells to contract as a unit.", "BIO-C7-003", "Muscle tissue", "Medium"],
  ["What structural difference distinguishes tendons from ligaments in dense connective tissues?", ["Tendons attach one bone to another bone, while ligaments attach skeletal muscles to bones.", "Tendons attach skeletal muscles to bones, whereas ligaments attach one bone to another.", "Tendons are specialized fluid connective tissues, whereas ligaments are loose connective tissues.", "Tendons contain mainly yellow elastic fibers, while ligaments possess white collagen fibers exclusively."], 1, "Tendons attach skeletal muscles to bones (dense regular connective tissue with tough collagen fibers) and ligaments attach one bone to another bone (contain elastic tissue along with collagen).", "BIO-C7-004", "Connective tissue", "Medium"],
  ["What is the specific functional significance of the typhlosole in the intestine of an earthworm (Pheretima)?", ["It helps in grinding the food particles ingested from soil.", "It secretes digestive enzymes into the intestinal lumen.", "It increases the effective area of absorption in the intestine.", "It aids in the formation of cocoons during reproduction."], 2, "The typhlosole is an internal median fold of the dorsal wall of the intestine (from segment 26 onwards) that effectively increases the absorptive surface area for digested food.", "BIO-C7-005", "Earthworm anatomy", "Medium"]]},
 {id:'bio2',no:8,name:'Cell: The Unit of Life',desc:'Cell theory, organelles and membrane.',lv:'Medium',q:[
  ['Which organelle is the "powerhouse of the cell"?',['Ribosome','Mitochondrion','Golgi body','Lysosome'],1,'Mitochondria produce most of the cell\'s ATP.'],
  ['Cell theory was proposed by…',['Schleiden and Schwann','Watson and Crick','Hooke and Brown','Singer and Nicolson'],0,'Schleiden and Schwann formulated it; Virchow extended it.'],
  ['Ribosomes are the site of…',['Photosynthesis','Protein synthesis','Lipid storage','DNA replication'],1,'Ribosomes translate mRNA into proteins.'],
  ['Which cells lack a membrane-bound nucleus?',['Plant cells','Animal cells','Bacterial cells','Fungal cells'],2,'Bacteria are prokaryotes with no true nucleus.'],
  ['The fluid mosaic model of the membrane was given by…',['Singer and Nicolson','Schwann and Virchow','Robert Brown','Palade'],0,'Singer and Nicolson proposed it in 1972.']]}]},
{id:'che',name:'Chemistry',c:'--che',m:'Chem',e:'🥽',ch:[
 {id:'che1',no:1,name:'Some Basic Concepts of Chemistry',desc:'Mole concept, stoichiometry, molarity.',lv:'Medium',q:[
  ['Molar mass of H₂O (H=1, O=16) is…',['16 g/mol','18 g/mol','20 g/mol','2 g/mol'],1,'2(1)+16 = 18 g/mol.'],
  ['Avogadro\'s number is approximately…',['6.022×10²³','6.022×10²⁰','3×10⁸','9.1×10⁻³¹'],0,'One mole contains 6.022×10²³ entities.'],
  ['Moles in 44 g of CO₂ (C=12, O=16)?',['0.5','1','2','4'],1,'Molar mass = 44 g/mol, so 44/44 = 1 mol.'],
  ['The law of conservation of mass was given by…',['Lavoisier','Dalton','Avogadro','Proust'],0,'Lavoisier: mass is neither created nor destroyed in a reaction.'],
  ['Molarity of 4 g NaOH (40 g/mol) in 500 mL solution?',['0.1 M','0.2 M','0.4 M','2 M'],1,'Moles = 4/40 = 0.1; volume 0.5 L; M = 0.1/0.5 = 0.2 M.']]},
 {id:'che2',no:2,name:'Structure of Atom',desc:'Subatomic particles, quantum numbers, orbitals.',lv:'Medium',q:[
  ['Who discovered the electron?',['Rutherford','J.J. Thomson','Bohr','Chadwick'],1,'Thomson found it via cathode-ray experiments.'],
  ['Maximum electrons in the n = 3 shell (2n²)?',['8','18','32','9'],1,'2×3² = 18.'],
  ['Neutrons in ¹⁴₆C?',['6','8','14','20'],1,'Neutrons = mass number − atomic number = 14−6 = 8.'],
  ['Orbitals with azimuthal quantum number l = 1 are…',['Spherical','Dumbbell-shaped (p)','Double-dumbbell','Ring'],1,'l=1 is the p subshell with dumbbell shape.'],
  ['Pauli exclusion principle says…',['Electrons fill lowest energy first','No two electrons share all four quantum numbers','Electrons pair only after singles','Energy is quantised'],1,'Each orbital holds at most two electrons of opposite spin.']]},
 {id:'che_c3',no:3,name:"Classification of Elements and Periodicity in Properties",desc:"Periodic law and trends in radius, ionisation and electron gain enthalpy.",lv:'Medium',q:[
  ["Who modified Mendeleev's periodic table by using atomic number instead of atomic mass as the basis of classification?", ["Dmitri Mendeleev", "Henry Moseley", "Julius Lothar Meyer", "Antoine Lavoisier"], 1, "Henry Moseley showed that atomic number is a more fundamental property than atomic mass after his work with X-ray spectra.", "CHE-C3-001", "Moseley and atomic number", "Medium"],
  ["Which of the following isoelectronic species has the smallest ionic radius?", ["O²⁻", "F⁻", "Na⁺", "Mg²⁺"], 3, "For isoelectronic species, a higher nuclear charge exerts a stronger inward electrostatic pull, resulting in a smaller ionic radius.", "CHE-C3-002", "Isoelectronic ionic radius", "Medium"],
  ["The successive ionization enthalpies (I₁, I₂, I₃) of an element are 168 kJ/mol, 337 kJ/mol, and 6050 kJ/mol respectively. What is the number of valence electrons in this element?", ["Two", "One", "Three", "Four"], 0, "The massive jump between I₂ and I₃ indicates that the third electron is being removed from a stable, inner core noble gas configuration, meaning there are 2 valence electrons.", "CHE-C3-003", "Ionisation enthalpy", "Medium"],
  ["Why does fluorine have a less negative electron gain enthalpy than chlorine, contrary to the general trend up a group?", ["Chlorine has d-orbitals while fluorine lacks them entirely.", "Fluorine is a gas at room temperature.", "The compact 2p subshell of fluorine causes strong interelectronic repulsions, making incoming electron addition less favorable.", "Fluorine has a lower nuclear charge than chlorine."], 2, "Because fluorine's 2p orbital is very small and compact, adding an extra electron creates significant electron-electron repulsion.", "CHE-C3-004", "Electron gain enthalpy", "Medium"],
  ["The first ionization enthalpy of nitrogen (Z = 7) is greater than that of oxygen (Z = 8). What is the primary reason for this anomaly?", ["Nitrogen has a smaller atomic radius than oxygen.", "Nitrogen has a stable, half-filled 2p³ electronic configuration.", "Nitrogen is located further left in the period, decreasing nuclear attraction.", "Oxygen undergoes strong inter-orbital shielding."], 1, "Half-filled and fully filled subshells possess extra exchange energy and spherical symmetry, making them exceptionally stable.", "CHE-C3-005", "Ionisation enthalpy anomaly", "Medium"],
  ["How does atomic radius generally vary as you move from left to right across a period in the periodic table?", ["It decreases because the nuclear charge increases while electrons enter the same principal shell.", "It increases due to the addition of more electrons.", "It remains completely constant across the entire period.", "It first increases and then abruptly drops to zero."], 0, "As atomic number increases across a period, the increased nuclear pull draws the electron cloud closer, decreasing the atomic radius.", "CHE-C3-006", "Atomic radius trend", "Medium"],
  ["Which of the following pairs of elements exhibits a diagonal relationship due to similar charge-to-radius ratios?", ["Sodium and Calcium", "Boron and Silicon", "Lithium and Beryllium", "Lithium and Magnesium"], 3, "Lithium (Period 2, Group 1) and Magnesium (Period 3, Group 2) show striking similarities in chemical properties due to their diagonal placement and comparable ionic radii.", "CHE-C3-007", "Diagonal relationship", "Medium"],
  ["According to IUPAC systematic nomenclature for elements with Z > 100, what is the symbol for an element with atomic number Z = 105?", ["Une", "Uns", "Unp", "Unt"], 2, "1 = un (u), 0 = nil (n), 5 = pent (p), giving the systematic symbol Unp (Unnilpentium).", "CHE-C3-008", "IUPAC nomenclature of Z > 100", "Medium"],
  ["Across a period from left to right in the modern periodic table, the chemical behavior of elements generally changes from:", ["Non-metallic to metallic", "Acidic to basic", "Metallic to non-metallic", "Inert to highly reactive"], 2, "Elements on the far left are highly metallic (alkali metals), while elements on the far right are non-metallic (halogens and noble gases).", "CHE-C3-009", "Periodic trends", "Medium"],
  ["Which of the following oxides is amphoteric in character?", ["Na₂O", "Al₂O₃", "CO₂", "SO₂"], 1, "Aluminium oxide (Al₂O₃) reacts with both acids (forming salts and water) and bases (forming aluminates), proving its amphoteric nature.", "CHE-C3-010", "Nature of oxides", "Medium"]]},
 {id:'che_c4',no:4,name:"Chemical Bonding and Molecular Structure",desc:"VSEPR, hybridisation, dipole moment and molecular orbital theory.",lv:'Hard',q:[
  ["Which of the following molecules contains a central atom with an expanded octet (more than 8 valence electrons)?", ["SF₆", "BF₃", "BeCl₂", "NH₃"], 0, "Sulphur in SF₆ has 6 bond pairs, so 12 electrons surround it (expanded octet). BF₃ and BeCl₂ have fewer than 8, and NH₃ has 8.", "CHE-C4-001", "Expanded octet", "Medium"],
  ["According to VSEPR theory, what is the predicted molecular shape of a ClF₃ molecule?", ["Trigonal planar", "T-shaped", "Trigonal pyramidal", "Square planar"], 1, "ClF₃ has 3 bond pairs and 2 lone pairs (steric number 5, sp³d). The lone pairs sit in equatorial positions, giving a T-shaped molecule.", "CHE-C4-002", "VSEPR theory", "Medium"],
  ["What is the hybridization of the central xenon atom in XeF₄?", ["sp³", "sp³d", "sp³d²", "dsp²"], 2, "XeF₄ has 4 bond pairs and 2 lone pairs (steric number 6), so Xe is sp³d² with octahedral electron geometry.", "CHE-C4-003", "Hybridisation", "Medium"],
  ["Why is the dipole moment of NH₃ (1.47 D) significantly higher than that of NF₃ (0.24 D), even though fluorine is much more electronegative than hydrogen?", ["NH₃ is a planar molecule while NF₃ is pyramidal.", "NF₃ does not have any lone pairs on the nitrogen atom.", "The N-H bonds are non-polar, whereas N-F bonds are highly polar.", "The orbital dipole due to the lone pair and the resultant N-F bond dipoles in NF₃ oppose each other, whereas in NH₃ they reinforce each other."], 3, "In NH₃ the lone-pair dipole and the N–H bond dipoles point the same way and add up. In NF₃ the N–F bond dipoles oppose the lone-pair dipole, so the net dipole moment is small.", "CHE-C4-004", "Dipole moment", "Medium"],
  ["According to Molecular Orbital Theory, which of the following diatomic species has the highest bond order?", ["O₂⁺", "O₂", "O₂⁻", "O₂²⁻"], 0, "Bond order of O₂⁺ is (10 − 5)/2 = 2.5, higher than O₂ (2), O₂⁻ (1.5) and O₂²⁻ (1). Removing an antibonding electron raises the bond order.", "CHE-C4-005", "Molecular orbital theory", "Medium"],
  ["Which of the following diatomic species is diamagnetic according to Molecular Orbital Theory?", ["O₂", "C₂", "B₂", "O₂⁻"], 1, "C₂ has 12 electrons, all paired in its molecular orbitals, so it is diamagnetic. O₂, B₂ and O₂⁻ have unpaired electrons.", "CHE-C4-006", "Molecular orbital theory", "Medium"],
  ["Arrange the following molecules in the correct increasing order of their bond angles: H₂O, NH₃, CH₄.", ["CH₄ < NH₃ < H₂O", "NH₃ < H₂O < CH₄", "H₂O < NH₃ < CH₄", "H₂O < CH₄ < NH₃"], 2, "CH₄ has no lone pair (109.5°), NH₃ has one (107°) and H₂O has two (104.5°). Lone pairs compress the bond angle.", "CHE-C4-007", "Bond angle", "Medium"],
  ["In which of the following molecules or ions is the central atom sp³d hybridized?", ["SF₆", "PCl₆⁻", "ICl₄⁻", "PCl₅"], 3, "PCl₅ has 5 bond pairs and no lone pair (steric number 5), so P is sp³d with trigonal bipyramidal shape. SF₆, PCl₆⁻ and ICl₄⁻ are sp³d².", "CHE-C4-008", "Hybridisation", "Medium"],
  ["Which of the following molecules possesses a net dipole moment of zero?", ["p-Dichlorobenzene", "o-Dichlorobenzene", "m-Dichlorobenzene", "Chloroform (CHCl₃)"], 0, "In p-dichlorobenzene the two C–Cl bond dipoles point in opposite directions (180°) and cancel, giving zero net dipole moment.", "CHE-C4-009", "Dipole moment", "Medium"],
  ["According to Molecular Orbital Theory, if the number of bonding electrons (Nb) is less than or equal to the number of antibonding electrons (Na) in a hypothetical diatomic species, what is the conclusion regarding its existence?", ["The species is exceptionally stable.", "The species is unstable and does not exist.", "The species must be diamagnetic.", "The species has a fractional positive bond order."], 1, "If Nb ≤ Na the bond order is zero or negative, so the species is unstable and does not exist.", "CHE-C4-010", "Molecular orbital theory", "Medium"],
  ["Which type of intermolecular force is primarily responsible for the abnormally high boiling point of water (H₂O) compared to H₂S?", ["London dispersion forces", "Hydrogen bonding", "Ion-dipole interaction", "Covalent bonding"], 1, "Oxygen is highly electronegative and bonded to hydrogen, allowing strong intermolecular hydrogen bonding which requires significantly more thermal energy to break.", "CHE-C4-011", "Hydrogen bonding", "Medium"]]},
 {id:'che_c5',no:5,name:"Thermodynamics",desc:"First law, enthalpy, entropy and Gibbs energy.",lv:'Medium',q:[
  ["A closed vessel containing hot coffee is completely wrapped in a thick layer of insulating material so that no heat or matter can enter or leave. What type of thermodynamic system does this represent?", ["Open system", "Closed system", "Isolated system", "Homogeneous system"], 2, "A system that is completely sealed against mass transfer and thermally insulated against energy transfer is an isolated system.", "CHE-C5-001", "System types", "Medium"],
  ["During a particular process, a system absorbs 400 J of heat and performs 150 J of work on the surroundings. What is the change in internal energy (ΔU) of the system?", ["+250 J", "+550 J", "−250 J", "−550 J"], 0, "By the first law, ΔU = q + w. Heat absorbed q = +400 J; work done by the system w = −150 J. So ΔU = 400 − 150 = +250 J.", "CHE-C5-002", "First law", "Medium"],
  ["For the reaction N₂(g) + 3H₂(g) → 2NH₃(g) at constant temperature, how does the enthalpy change (ΔH) relate to the internal energy change (ΔU)?", ["ΔH = ΔU", "ΔH = ΔU + RT", "ΔH = ΔU − 1.5RT", "ΔH = ΔU − 2RT"], 3, "Δn(g) = 2 − (1 + 3) = −2, and ΔH = ΔU + Δn(g)RT, so ΔH = ΔU − 2RT.", "CHE-C5-003", "Enthalpy and internal energy", "Medium"],
  ["When liquid water freezes to form ice at 0°C, what is the sign of the entropy change (ΔS_system) for the system?", ["Positive (ΔS > 0)", "Negative (ΔS < 0)", "Zero (ΔS = 0)", "Infinite (ΔS = ∞)"], 1, "Freezing turns a disordered liquid into an ordered solid, so the entropy of the system decreases (ΔS < 0).", "CHE-C5-004", "Entropy", "Medium"],
  ["A chemical reaction has both ΔH = −40 kJ/mol and ΔS = −100 J/(K·mol). Under what temperature condition will this reaction become spontaneous?", ["At all temperatures", "Only at high temperatures (T > 400 K)", "Only at low temperatures (T < 400 K)", "Never spontaneous at any temperature"], 2, "ΔG = ΔH − TΔS. With ΔH = −40,000 J/mol and ΔS = −100 J/(K·mol), ΔG < 0 needs −40,000 + 100T < 0, i.e. T < 400 K.", "CHE-C5-005", "Gibbs energy and spontaneity", "Medium"],
  ["Which of the following terms correctly describes a closed system that exchanges energy with its surroundings but does not exchange mass?", ["A beaker of boiling water kept uncovered on a laboratory bench", "A sealed metal cylinder filled with compressed gas immersed in a water bath", "Hot coffee kept in a perfectly insulated thermos flask", "A living plant growing in an open garden"], 1, "A sealed container prevents any mass transfer across its boundary, while the metal walls allow thermal energy exchange with the water bath. This defines a closed system.", "CHE-C5-006", "System types", "Medium"],
  ["Identify the pair in which both properties are classified as intensive properties.", ["Volume and Density", "Enthalpy and Temperature", "Refractive index and Boiling point", "Mass and Heat capacity"], 2, "Both refractive index and boiling point do not depend on the quantity or size of the substance present in the system, making them intensive properties.", "CHE-C5-007", "Intensive and extensive properties", "Medium"],
  ["Which of the following thermodynamic quantities is a state function?", ["Internal energy (U)", "Work (w)", "Heat (q)", "Both Work (w) and Heat (q)"], 0, "Internal energy depends only on the initial and final states, not on the path, so it is a state function. Work and heat are path functions.", "CHE-C5-008", "State functions", "Medium"],
  ["According to the IUPAC sign convention for the first law of thermodynamics, what are the signs of q and w when work is done on the system and heat is evolved by the system to the surroundings?", ["q is positive, w is negative", "q is positive, w is positive", "q is negative, w is negative", "q is negative, w is positive"], 3, "Heat evolved by the system means q < 0. Work done on the system increases its energy, so w > 0.", "CHE-C5-009", "Sign convention", "Medium"],
  ["A system absorbs 701 J of heat from its surroundings and does 394 J of work on the surroundings. What is the net change in internal energy (ΔU) of the system?", ["1095 J", "+307 J", "−307 J", "−1095 J"], 1, "ΔU = q + w with q = +701 J (absorbed) and w = −394 J (done by the system): ΔU = 701 − 394 = +307 J.", "CHE-C5-010", "First law", "Medium"],
  ["For an isothermal reversible expansion of an ideal gas from volume V₁ to V₂, the expression for work (w) is given by:", ["w = −P_ext(V₂ − V₁)", "w = −nRT ln(V₁/V₂)", "w = −2.303 nRT log(V₂/V₁)", "w = nRT ln(V₂/V₁)"], 2, "For reversible isothermal expansion, w = −nRT ln(V₂/V₁) = −2.303 nRT log(V₂/V₁). The work is negative because the gas does work on the surroundings.", "CHE-C5-011", "Work in reversible expansion", "Medium"],
  ["The enthalpy of combustion of carbon to CO₂ is −393.5 kJ mol⁻¹. What amount of heat is released when 35.2 g of CO₂ is produced? (Molar mass of CO₂ = 44 g mol⁻¹)", ["393.5 kJ", "314.8 kJ", "491.9 kJ", "157.4 kJ"], 1, "Moles of CO₂ = 35.2/44 = 0.8 mol. Heat released = 0.8 × 393.5 = 314.8 kJ.", "CHE-C5-012", "Enthalpy of combustion", "Medium"],
  ["Hess's law of constant heat summation is a direct consequence of which of the following?", ["The second law of thermodynamics", "The law of conservation of mass", "Enthalpy being a state function", "The first law of thermodynamics in cyclic processes"], 2, "Because enthalpy is a state function, the overall enthalpy change of a reaction depends only on the initial and final states, regardless of whether it occurs in one step or multiple steps.", "CHE-C5-013", "Hess's law", "Medium"],
  ["In which of the following processes does the entropy of the system decrease?", ["Freezing of water into ice at 0°C", "Melting of ice into water at 0°C", "Vaporization of liquid water", "Expansion of a gas into a vacuum"], 0, "Freezing converts a disordered liquid into an ordered solid, so the entropy of the system decreases. Melting, vaporisation and expansion into vacuum increase entropy.", "CHE-C5-014", "Entropy", "Medium"],
  ["What is the sign of entropy change (ΔS_total) for a spontaneous process in an isolated system?", ["ΔS_total < 0", "ΔS_total = 0", "It can be positive or negative depending on temperature", "ΔS_total > 0"], 3, "A spontaneous process in an isolated system always increases the total entropy, ΔS_total > 0 (second law).", "CHE-C5-015", "Second law", "Medium"],
  ["For a reaction to be spontaneous at constant temperature and pressure, the Gibbs free energy change (ΔG) must satisfy which condition?", ["ΔG = 0", "ΔG < 0", "ΔG > 0", "ΔG = +1"], 1, "At constant temperature and pressure, a process is spontaneous when ΔG < 0.", "CHE-C5-016", "Gibbs energy and spontaneity", "Medium"],
  ["If both ΔH and ΔS for a chemical reaction are positive (+ve), under what temperature condition will the reaction become spontaneous?", ["At low temperatures only", "It is spontaneous at all temperatures", "At high temperatures only", "It is non-spontaneous at all temperatures"], 2, "ΔG = ΔH − TΔS. If ΔH and ΔS are both positive, ΔG is negative only when TΔS > ΔH, i.e. at high temperature.", "CHE-C5-017", "Gibbs energy and spontaneity", "Medium"],
  ["What is the correct relationship between standard Gibbs energy change (ΔG°) and the equilibrium constant (K) for a reaction?", ["ΔG° = −RT ln K", "ΔG° = RT ln K", "ΔG° = −RT / K", "ΔG° = −K ln RT"], 0, "The standard Gibbs energy change is related to the equilibrium constant by ΔG° = −RT ln K (or −2.303 RT log K).", "CHE-C5-018", "Gibbs energy and equilibrium constant", "Medium"]]},
 {id:'che_c6',no:6,name:"Equilibrium",desc:"Dynamic equilibrium, Kp/Kc, Le Chatelier, pH and buffers.",lv:'Medium',q:[
  ["Which of the following statements correctly describes a reversible chemical system when it attains dynamic equilibrium?", ["The reaction ceases completely and reactants stop converting into products.", "The concentrations of all reactants and products become exactly equal.", "The rate of the forward reaction equals the rate of the backward reaction.", "Adding a catalyst changes the final equilibrium concentrations of substances."], 2, "At dynamic equilibrium, the rate of conversion of reactants to products equals the rate of conversion of products back to reactants.", "CHE-C6-001", "Dynamic equilibrium", "Medium"],
  ["For the homogeneous gaseous equilibrium reaction N₂(g) + 3H₂(g) ⇌ 2NH₃(g), what is the relationship between Kp and Kc?", ["Kp = Kc", "Kp = Kc(RT)²", "Kp = Kc(RT)⁻²", "Kp = Kc(RT)⁻¹"], 2, "Δn(g) = 2 − 4 = −2, so Kp = Kc(RT)^Δn(g) = Kc(RT)⁻².", "CHE-C6-002", "Kp and Kc", "Medium"],
  ["If the reaction quotient Qc for a reversible reaction is found to be greater than the equilibrium constant Kc, in which direction will the net reaction proceed?", ["In the reverse (backward) direction", "In the forward direction", "The system is already at dynamic equilibrium.", "No reaction will take place in either direction."], 0, "If Qc > Kc there are too many products relative to equilibrium, so the net reaction goes in the reverse direction.", "CHE-C6-003", "Reaction quotient", "Medium"],
  ["For the exothermic gas-phase reaction 2SO₂(g) + O₂(g) ⇌ 2SO₃(g), ΔH = −197.7 kJ mol⁻¹, how will an increase in temperature affect the equilibrium concentration of SO₃?", ["It will increase the yield of SO₃.", "It will decrease the yield of SO₃.", "It will have no effect on the equilibrium concentration.", "It will drive the reaction completely to completion in the forward direction."], 1, "The forward reaction is exothermic, so raising the temperature shifts the equilibrium backward (Le Chatelier's principle) and the SO₃ yield decreases.", "CHE-C6-004", "Le Chatelier's principle", "Medium"],
  ["What is the pH of a 0.01 M aqueous solution of hydrochloric acid (HCl), assuming complete dissociation?", ["1", "2", "12", "0.01"], 1, "[H⁺] = 0.01 M = 10⁻² M, so pH = −log 10⁻² = 2.", "CHE-C6-005", "pH", "Medium"],
  ["Which of the following combinations of solutions can function as an acidic buffer solution?", ["CH₃COOH and CH₃COONa", "NH₄OH and NH₄Cl", "HCl and NaCl", "NaOH and NaCl"], 0, "An acidic buffer is a weak acid with its salt of a strong base: CH₃COOH and CH₃COONa. NH₄OH with NH₄Cl is a basic buffer.", "CHE-C6-006", "Buffer solutions", "Medium"]]},
 {id:'che_c7',no:7,name:"Redox Reactions",desc:"Oxidation number, redox agents and electrode potential.",lv:'Medium',q:[
  ["What is the oxidation number of chromium (Cr) in potassium dichromate, K₂Cr₂O₇?", ["+3", "+6", "+7", "+5"], 1, "Let Cr = x: 2(+1) + 2x + 7(−2) = 0, so 2x = 12 and x = +6.", "CHE-C7-001", "Oxidation number", "Medium"],
  ["In the redox reaction Zn(s) + Cu²⁺(aq) → Zn²⁺(aq) + Cu(s), which species acts as the reducing agent?", ["Zn", "Cu²⁺", "Zn²⁺", "Cu"], 0, "Zn is oxidised (0 to +2) by losing electrons, so it is the reducing agent.", "CHE-C7-002", "Oxidising and reducing agents", "Medium"],
  ["Which of the following hydrogen halides or chlorine species does not undergo disproportionation reactions?", ["HClO", "HClO₂", "HCl", "HClO₃"], 2, "In HCl, chlorine is already in its lowest oxidation state (−1), so it can only be oxidised and cannot disproportionate.", "CHE-C7-003", "Disproportionation", "Medium"],
  ["The thermal decomposition reaction 2KClO₃(s) –Δ→ 2KCl(s) + 3O₂(g) is best classified as which type of redox reaction?", ["Disproportionation reaction", "Displacement reaction", "Decomposition redox reaction", "Combination reaction"], 2, "The breakdown of a single compound into two or more components where chlorine is reduced (from +5 to -1) and oxygen is oxidized (from -2 to 0) is a decomposition redox reaction.", "CHE-C7-004", "Types of redox reactions", "Medium"],
  ["Given the standard reduction potentials E°(Zn²⁺/Zn) = −0.76 V and E°(Cu²⁺/Cu) = +0.34 V, what is the standard cell potential (E°_cell) for a Daniell cell?", ["−1.10 V", "+1.10 V", "+0.42 V", "−0.42 V"], 1, "E°cell = E°cathode − E°anode = 0.34 − (−0.76) = +1.10 V.", "CHE-C7-005", "Electrode potential", "Medium"]]},
 {id:'che_c8',no:8,name:"Organic Chemistry: Basic Principles and Techniques",desc:"Hybridisation, nomenclature, electronic effects, intermediates and tests.",lv:'Medium',q:[
  ["What is the hybridization of each carbon atom in allene (CH₂=C=CH₂) from left to right?", ["sp³, sp², sp³", "sp², sp, sp²", "sp, sp², sp", "sp², sp², sp²"], 1, "Each end carbon has three σ bonds (sp²). The central carbon has two σ and two π bonds, so it is sp (linear).", "CHE-C8-001", "Hybridisation", "Medium"],
  ["What is the correct IUPAC name for the organic compound CH₃-CH(OH)-CH₂-COOH?", ["2-hydroxybutanoic acid", "4-hydroxybutan-2-oic acid", "3-hydroxybutanoic acid", "3-hydroxybutan-1-one"], 2, "Number the chain from the COOH carbon (C1). The OH group is on C3, so the name is 3-hydroxybutanoic acid.", "CHE-C8-002", "IUPAC nomenclature", "Medium"],
  ["Which of the following conditions or statements is INCORRECT regarding valid contributing resonance structures?", ["All contributing structures must possess the same number of paired and unpaired electrons.", "The relative positions of atomic nuclei must remain unchanged across all contributing structures.", "Covalent structures with a greater number of total covalent bonds are generally more stable contributors.", "Contributing resonance structures must all possess identical energy contents and real individual existence."], 3, "Individual canonical structures are hypothetical, have varying energy levels, and do not independently exist. Only the resonance hybrid is a real, lower-energy species.", "CHE-C8-003", "Resonance", "Medium"],
  ["Which of the following functional groups exerts a strong −I (negative inductive) effect when attached to an alkyl chain?", ["−NO₂", "−CH₃", "−C₂H₅", "−O⁻"], 0, "The nitro group is strongly electron-withdrawing and shows a strong −I effect. Alkyl groups are electron-releasing (+I).", "CHE-C8-004", "Inductive effect", "Medium"],
